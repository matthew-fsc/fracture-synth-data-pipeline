[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external dependencies)
    slow: Slow running tests
    requires_azure: Tests that require Azure credentials/services
    requires_openai: Tests that require OpenAI/Azure OpenAI access

